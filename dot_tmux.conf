# Workspace-oriented tmux config for NvChad muscle memory

# Prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Sensible defaults
set -g mouse on
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 100000

# Faster key handling
set -sg escape-time 0
set -g repeat-time 250

# Reuse cwd when splitting
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane actions
bind x kill-pane
bind z resize-pane -Z
bind e select-layout even-horizontal
bind E select-layout even-vertical
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Pane traversal (no prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Resize pane with Shift+Alt+h/j/k/l
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 5

# Quick pane numbering hint
bind q display-panes

# Discoverable action menu on prefix+Space
bind Space display-menu -T "tmux actions" \
  "Move Left (Alt-h)" "" "" \
  "Move Down (Alt-j)" "" "" \
  "Move Up (Alt-k)" "" "" \
  "Move Right (Alt-l)" "" "" \
  "Split Horizontal" "s" "split-window -v -c '#{pane_current_path}'" \
  "Split Vertical" "v" "split-window -h -c '#{pane_current_path}'" \
  "Zoom Toggle" "z" "resize-pane -Z" \
  "Kill Pane" "x" "kill-pane" \
  "Even Layout H" "e" "select-layout even-horizontal" \
  "Even Layout V" "E" "select-layout even-vertical" \
  "Reload Config" "r" "source-file ~/.tmux.conf"
